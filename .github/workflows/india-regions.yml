name: Refresh India regions data

# Rebuilds client/src/data/india/*.json (district headquarters of every Indian state)
# from OpenStreetMap and commits the result to the branch it runs on.
# Runs when the generator or the state list changes, or on demand from the Actions tab:
# "Refresh India regions data" → Run workflow.
on:
  push:
    paths:
      - scripts/build-india-regions.mjs
      - client/src/data/indiaStates.js
      - .github/workflows/india-regions.yml
  workflow_dispatch:
    inputs:
      states:
        description: 'Space-separated ISO codes to rebuild (e.g. "IN-TN IN-KL"). Empty: only missing states.'
        required: false
        default: ''
      refresh:
        description: 'Rebuild every state (ignored when states are given)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: india-regions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The branch head, not the triggering commit, so a re-run resumes from data committed
      # by earlier runs.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build data from OpenStreetMap
        env:
          STATES: ${{ inputs.states }}
          REFRESH: ${{ inputs.refresh && '--refresh' || '' }}
        # Unquoted on purpose so the codes split into separate arguments.
        # Stops starting new states after 45 minutes so the commit step always runs before
        # the job's 60-minute limit. Run the workflow again to continue.
        run: node scripts/build-india-regions.mjs --budget-minutes=45 $REFRESH $STATES

      # Commit whatever was built, even if some states failed, so the next run resumes.
      - name: Commit changes
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/data/india
          if git diff --cached --quiet; then
            echo "Data unchanged."
            exit 0
          fi
          git commit -m "Update India regions data from OpenStreetMap"
          # The branch may have moved while the data was being built.
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
