name: Refresh India regions data

# Rebuilds client/src/data/india/*.json (district headquarters of every Indian state)
# from OpenStreetMap and commits the result to the branch it runs on.
# Runs when the generator or the state list changes, or on demand from the Actions tab:
# "Refresh India regions data" → Run workflow.
on:
  push:
    paths:
      - scripts/build-india-regions.mjs
      - client/src/data/indiaStates.js
      - .github/workflows/india-regions.yml
  workflow_dispatch:
    inputs:
      states:
        description: 'Space-separated ISO codes to rebuild (e.g. "IN-TN IN-KL"); empty for all'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: india-regions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build data from OpenStreetMap
        env:
          STATES: ${{ inputs.states }}
        # $STATES is intentionally unquoted so it splits into separate codes.
        run: node scripts/build-india-regions.mjs $STATES

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/data/india
          if git diff --cached --quiet; then
            echo "Data unchanged."
            exit 0
          fi
          git commit -m "Update India regions data from OpenStreetMap"
          git push
